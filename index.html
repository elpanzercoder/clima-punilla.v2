<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clima Punilla - Canal TV</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0a1a; font-family: Arial, sans-serif; color: #fff; }
.layout { display: flex; flex-direction: column; min-height: 100vh; }

/* ── TOPBAR ── */
.topbar {
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.upd { font-size: 12px; color: #bbb; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 700; }
.btn-refresh { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
.btn-refresh:hover { background: rgba(255,255,255,0.22); }
.btn-dl { background: #e67e22; color: #fff; }
.btn-dl:hover { background: #d35400; }
.btn-panel { background: #8e44ad; color: #fff; }
.btn-panel:hover { background: #6c3483; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── TABS ── */
.tabs { display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
.tab-btn {
  padding: 10px 28px; background: transparent; border: none; color: rgba(255,255,255,0.5);
  cursor: pointer; font-size: 13px; font-weight: 700; border-bottom: 3px solid transparent;
  transition: all 0.2s;
}
.tab-btn.on { color: #fff; border-bottom-color: #e67e22; }
.tab-btn:hover { color: #fff; }

/* ── CANVAS ── */
.main-area { padding: 14px; }
#weatherCanvas, #extCanvas {
  width: 100%; height: auto; border-radius: 10px; display: block;
  box-shadow: 0 6px 28px rgba(0,0,0,0.5);
}
.loading-msg {
  text-align: center; padding: 60px 20px; color: #aaa; font-size: 15px;
  background: rgba(255,255,255,0.04); border-radius: 12px;
}

/* ── PANEL INFERIOR ── */
.side-panel {
  height: 0; overflow: hidden;
  background: #1a0f2e;
  border-top: 1px solid rgba(255,255,255,0.1);
  transition: height 0.35s ease;
}
.side-panel.open { height: auto; overflow: visible; }
.panel-header {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; justify-content: space-between; align-items: center;
}
.panel-header h3 { font-size: 13px; font-weight: 700; color: #e0c060; letter-spacing: 1px; }
.btn-close { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
.btn-close:hover { color: #fff; }

/* Sliders */
.sliders-section { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); }
.sliders-section h4 { font-size: 11px; color: #a0a0c0; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
.sliders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px 24px; }
.slider-row label { font-size: 11px; color: #ccc; display: flex; justify-content: space-between; margin-bottom: 4px; }
.slider-row label span { color: #e0c060; font-weight: 700; }
input[type=range] { width: 100%; accent-color: #e0c060; height: 4px; cursor: pointer; }
input[type=color] { width: 100%; height: 30px; border-radius: 6px; cursor: pointer; border: none; background: none; }

/* Ciudades */
.cities-section { padding: 14px 20px; }
.cities-section h4 { font-size: 11px; color: #a0a0c0; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
.cities-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px,1fr)); gap: 8px; }
.edit-card { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 10px; border: 1px solid rgba(255,255,255,0.08); }
.edit-card .city-name { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #e0c060; margin-bottom: 7px; }
.edit-card select, .edit-card input[type=number] {
  width: 100%; padding: 5px 8px; border-radius: 6px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; font-size: 12px; margin-bottom: 5px;
}
.edit-card select option { background: #1a0f2e; }
.edit-card .temps { display: flex; gap: 5px; }
.edit-card .temps > div { flex: 1; }
.edit-card label { font-size: 10px; color: #888; display: block; margin-bottom: 2px; }
.edit-card input[type=number] { margin-bottom: 0; }

/* Panel extendido */
.ext-edit { padding: 14px 20px; }
.ext-edit h4 { font-size: 11px; color: #a0a0c0; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
.ext-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ext-card { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 12px; border: 1px solid rgba(255,255,255,0.08); }
.ext-card .day-label { font-size: 11px; font-weight: 700; color: #e0c060; margin-bottom: 8px; text-transform: uppercase; }
.ext-card select, .ext-card input[type=number] {
  width: 100%; padding: 5px 8px; border-radius: 6px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; font-size: 12px; margin-bottom: 6px;
}
.ext-card select option { background: #1a0f2e; }
.ext-card .row3 { display: flex; gap: 5px; }
.ext-card .row3 > div { flex: 1; }
.ext-card label { font-size: 10px; color: #888; display: block; margin-bottom: 2px; }

.btn-apply {
  margin: 12px 20px 16px; padding: 10px 32px; border-radius: 8px;
  background: #27ae60; color: #fff; border: none;
  font-size: 13px; font-weight: 700; cursor: pointer; display: block;
}
.btn-apply:hover { background: #219a52; }
</style>
</head>
<body>
<div class="layout">

  <div class="topbar">
    <span class="upd" id="upd">Cargando...</span>
    <div class="btns">
      <button class="btn btn-refresh" onclick="loadAll()">↻ Actualizar</button>
      <button class="btn btn-panel" onclick="togglePanel()">✏️ Editar</button>
      <button class="btn btn-dl" id="btnDl" onclick="descargarActual()" disabled>⬇ Descargar</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn on" onclick="showTab('loc',this)">📺 Clima localidades</button>
    <button class="tab-btn" onclick="showTab('ext',this)">📅 Pronóstico extendido</button>
  </div>

  <div class="main-area">
    <div id="loading-msg" class="loading-msg">⏳ Cargando clima e imágenes...</div>
    <div id="tab-loc" style="display:none"><canvas id="weatherCanvas"></canvas></div>
    <div id="tab-ext" style="display:none"><canvas id="extCanvas"></canvas></div>
  </div>

  <!-- PANEL INFERIOR -->
  <div class="side-panel" id="sidePanel">
    <div class="panel-header">
      <h3 id="panel-title">✏️ AJUSTES — LOCALIDADES</h3>
      <button class="btn-close" onclick="togglePanel()">✕</button>
    </div>

    <!-- SLIDERS GLOBALES -->
    <div class="sliders-section">
      <h4>Escala global</h4>
      <div class="sliders-grid">
        <div class="slider-row">
          <label>Íconos <span id="val-icon">100%</span></label>
          <input type="range" id="sl-icon" min="50" max="200" value="100" oninput="actualizarSlider('icon',this.value)">
        </div>
        <div class="slider-row">
          <label>Condición <span id="val-cond">100%</span></label>
          <input type="range" id="sl-cond" min="50" max="200" value="100" oninput="actualizarSlider('cond',this.value)">
        </div>
        <div class="slider-row">
          <label>Temperaturas <span id="val-temp">100%</span></label>
          <input type="range" id="sl-temp" min="50" max="200" value="100" oninput="actualizarSlider('temp',this.value)">
        </div>
        <div class="slider-row">
          <label>Color temperaturas</label>
          <input type="color" id="color-temp" value="#ffffff" oninput="redibujarActual()">
        </div>
        <div class="slider-row">
          <label>Color condición</label>
          <input type="color" id="color-cond" value="#ffffff" oninput="redibujarActual()">
        </div>
      </div>
    </div>

    <!-- PANEL LOCALIDADES -->
    <div id="panel-loc">
      <div class="cities-section">
        <h4>Datos por ciudad</h4>
        <div class="cities-grid" id="edit-grid"></div>
      </div>
      <button class="btn-apply" onclick="aplicarEdicion()">✅ Aplicar cambios</button>
    </div>

    <!-- PANEL EXTENDIDO -->
    <div id="panel-ext" style="display:none">
      <div class="ext-edit">
        <h4>Datos del pronóstico (próximos 3 días · Villa Carlos Paz)</h4>
        <div class="ext-grid" id="ext-edit-grid"></div>
      </div>
      <button class="btn-apply" onclick="aplicarEdicionExt()">✅ Aplicar cambios</button>
    </div>

  </div>
</div>

<script>
// ─── LOCALIDADES ────────────────────────────────────────────────────────────
const LOCS = [
  { n:"VILLA CARLOS PAZ",      lat:-31.4241, lon:-64.4978,
    cx:292,  cy:285,  iconSize:220, condY:430, tempY:490, fontSize:24, tempSize:33 },
  { n:"SAN ANTONIO",           lat:-31.4667, lon:-64.5167,
    cx:708,  cy:350,  iconSize:140, condY:458, tempY:505, fontSize:21, tempSize:28 },
  { n:"BIALET MASSÉ",          lat:-31.3167, lon:-64.4833,
    cx:1041, cy:350,  iconSize:140, condY:458, tempY:505, fontSize:21, tempSize:28 },
  { n:"V. PARQUE SIQUIMÁN",    lat:-31.3667, lon:-64.5000,
    cx:1376, cy:355,  iconSize:140, condY:462, tempY:510, fontSize:21, tempSize:28 },
  { n:"STA. MARÍA DE PUNILLA", lat:-31.3667, lon:-64.4667,
    cx:1722, cy:352,  iconSize:140, condY:460, tempY:507, fontSize:21, tempSize:28 },
  { n:"LA CUMBRE",             lat:-30.9667, lon:-64.5167,
    cx:228,  cy:700,  iconSize:120, condY:784, tempY:827, fontSize:21, tempSize:28 },
  { n:"LOS COCOS",             lat:-30.9833, lon:-64.5333,
    cx:532,  cy:700,  iconSize:120, condY:780, tempY:822, fontSize:21, tempSize:28 },
  { n:"CAPILLA DEL MONTE",     lat:-30.8600, lon:-64.5250,
    cx:832,  cy:700,  iconSize:120, condY:784, tempY:827, fontSize:21, tempSize:28 },
  { n:"MALAGUEÑO",             lat:-31.4647, lon:-64.3586,
    cx:1125, cy:700,  iconSize:120, condY:784, tempY:827, fontSize:21, tempSize:28 },
  { n:"CÓRDOBA",               lat:-31.4201, lon:-64.1888,
    cx:1436, cy:700,  iconSize:120, condY:778, tempY:820, fontSize:21, tempSize:28 },
  { n:"COSQUÍN",               lat:-31.2451, lon:-64.4656,
    cx:1743, cy:700,  iconSize:120, condY:784, tempY:827, fontSize:21, tempSize:28 },
];

// ─── POSICIONES EXTENDIDO (1920x1080) ───────────────────────────────────────
// Panel principal izquierdo: cx=679, y desde 108 hasta 942
// Paneles derechos: arriba cy=316, abajo cy=709, cx=1312
const EXT_POS = {
  // Panel principal — posiciones detectadas de marcas
  main: {
    dayX: 380, dayY: 213,           // JUEVES
    rainPctX: 980, rainPctY: 213,   // 10%
    cityX: 290, cityY: 310,         // VILLA CARLOS PAZ
    iconX: 968, iconY: 530, iconSize: 260, // ícono grande
    maxX: 290, maxY: 460,           // 15°
    minX: 290, minY: 590,           // 9°
    condX: 610, condY: 870,         // NUBLADO
  },
  // Panel derecho arriba: x=1160-1620, y=120-500 -> cx=1390, cy=310
  d1: {
    dayX: 1165, dayY: 175,
    iconX: 1290, iconY: 305, iconSize: 140,
    rainPctX: 1500, rainPctY: 200,
    condX: 1165, condY: 420,
    tempX: 1165, tempY: 465,
  },
  // Panel derecho abajo: x=1160-1620, y=520-900 -> cx=1390, cy=710
  d2: {
    dayX: 1165, dayY: 565,
    iconX: 1290, iconY: 690, iconSize: 140,
    rainPctX: 1500, rainPctY: 590,
    condX: 1165, condY: 800,
    tempX: 1165, tempY: 845,
  },
};

const DIAS = ["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
const CONDICIONES = ["DESPEJADO","SEMINUBLADO","NUBLADO","LLUVIA","LLOVIZNA","TORMENTA","NIEBLA","NIEVE","VARIABLE"];
const ICONOS_NOMBRES = ["despejado","seminublado","nublado","lluvia","llovizna","tormenta","niebla","nieve"];
const condToFile = {
  "DESPEJADO":"despejado","SEMINUBLADO":"seminublado","NUBLADO":"nublado",
  "LLUVIA":"lluvia","LLOVIZNA":"llovizna","TORMENTA":"tormenta",
  "NIEBLA":"niebla","NIEVE":"nieve","VARIABLE":"nublado"
};

function wmo(c) {
  if (c===0)                                     return {l:"DESPEJADO",   f:"despejado"};
  if ([1,2].includes(c))                         return {l:"SEMINUBLADO", f:"seminublado"};
  if (c===3)                                     return {l:"NUBLADO",     f:"nublado"};
  if ([45,48].includes(c))                       return {l:"NIEBLA",      f:"niebla"};
  if ([51,53,55,56,57].includes(c))              return {l:"LLOVIZNA",    f:"llovizna"};
  if ([61,63,65,66,67,80,81,82].includes(c))     return {l:"LLUVIA",      f:"lluvia"};
  if ([71,73,75,77].includes(c))                 return {l:"NIEVE",       f:"nieve"};
  if ([95,96,99].includes(c))                    return {l:"TORMENTA",    f:"tormenta"};
  return {l:"VARIABLE", f:"nublado"};
}

function dayName(off) {
  const d = new Date(); d.setDate(d.getDate()+off); return DIAS[d.getDay()];
}

// ─── ESTADO ─────────────────────────────────────────────────────────────────
let weatherData = [];
let extData = [];      // [{cond, condFile, max, min, rain}, x3]
let imgPlantilla = null, imgExt = null;
let imgIconos = {}, imgRainCloud = null;
let scales = { icon:1, cond:1, temp:1 };
let tabActual = 'loc';

// ─── CARGAR IMÁGENES ─────────────────────────────────────────────────────────
function cargarImagen(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("No cargó: " + src));
    img.src = src + "?v=" + Date.now();
  });
}

async function cargarTodosLosAssets() {
  imgPlantilla = await cargarImagen("img/plantilla_sola.png");
  imgExt = await cargarImagen("img/plantilla_extendido.jpg");
  for (const n of ICONOS_NOMBRES) {
    imgIconos[n] = await cargarImagen(`img/${n}.png`);
  }
  // Ícono nube negra lluvia — usamos el de lluvia en escala de grises
  imgRainCloud = imgIconos["lluvia"];
}

// ─── FETCH ───────────────────────────────────────────────────────────────────
async function fetchLoc(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FArgentina%2FCordoba&forecast_days=4`;
  for (let i=0; i<3; i++) {
    try { const r=await fetch(url); if(r.ok) return await r.json(); } catch(e){}
    await new Promise(r=>setTimeout(r,1500));
  }
  return null;
}

async function loadAll() {
  document.getElementById('upd').textContent = 'Actualizando...';
  document.getElementById('btnDl').disabled = true;
  document.getElementById('loading-msg').style.display = 'block';
  document.getElementById('tab-loc').style.display = 'none';
  document.getElementById('tab-ext').style.display = 'none';

  try { await cargarTodosLosAssets(); }
  catch(e) { document.getElementById('loading-msg').textContent = '⚠️ Error: '+e.message; return; }

  const raw = await Promise.all(LOCS.map(l=>fetchLoc(l.lat,l.lon)));

  weatherData = LOCS.map((loc,i) => {
    const d = raw[i];
    if (!d) return {cond:"VARIABLE",condFile:"nublado",max:"--",min:"--"};
    const w = wmo(d.daily.weather_code[0]);
    return {cond:w.l, condFile:w.f, max:Math.round(d.daily.temperature_2m_max[0]), min:Math.round(d.daily.temperature_2m_min[0])};
  });

  // Extendido: próximos 3 días de Carlos Paz (índices 1,2,3)
  const cp = raw[0];
  extData = [1,2,3].map(i => {
    if (!cp) return {cond:"VARIABLE",condFile:"nublado",max:"--",min:"--",rain:0};
    const w = wmo(cp.daily.weather_code[i]);
    return {
      cond:w.l, condFile:w.f,
      max:Math.round(cp.daily.temperature_2m_max[i]),
      min:Math.round(cp.daily.temperature_2m_min[i]),
      rain:cp.daily.precipitation_probability_max[i]||0
    };
  });

  dibujarLocalidades();
  dibujarExtendido();
  construirPanelLoc();
  construirPanelExt();

  document.getElementById('loading-msg').style.display = 'none';
  showTab(tabActual, document.querySelector('.tab-btn.on'));
  document.getElementById('btnDl').disabled = false;

  const now = new Date();
  document.getElementById('upd').textContent =
    'Actualizado: '+now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+
    ' · '+now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
}

// ─── DIBUJAR LOCALIDADES ─────────────────────────────────────────────────────
function dibujarLocalidades() {
  const canvas = document.getElementById('weatherCanvas');
  canvas.width = 1920; canvas.height = 1080;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgPlantilla, 0, 0, 1920, 1080);

  const colorTemp = document.getElementById('color-temp').value;
  const colorCond = document.getElementById('color-cond').value;

  LOCS.forEach((loc,i) => {
    const d = weatherData[i];
    const icono = imgIconos[d.condFile]||imgIconos["nublado"];
    const is = loc.iconSize * scales.icon;
    ctx.drawImage(icono, loc.cx-is/2, loc.cy-is/2, is, is);

    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.shadowColor="rgba(0,0,0,0.95)"; ctx.shadowBlur=8; ctx.shadowOffsetX=2; ctx.shadowOffsetY=2;

    ctx.font=`900 ${Math.round(loc.fontSize*scales.cond)}px Arial`;
    ctx.fillStyle=colorCond;
    ctx.fillText(d.cond, loc.cx, loc.condY);

    ctx.font=`900 ${Math.round(loc.tempSize*scales.temp)}px Arial`;
    ctx.fillStyle=colorTemp;
    ctx.fillText(`${d.max}° / ${d.min}°`, loc.cx, loc.tempY);
    ctx.restore();
  });
}

// ─── DIBUJAR EXTENDIDO ───────────────────────────────────────────────────────
function dibujarExtendido() {
  const canvas = document.getElementById('extCanvas');
  canvas.width = 1920; canvas.height = 1080;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgExt, 0, 0, 1920, 1080);

  const colorTemp = document.getElementById('color-temp').value;
  const colorCond = document.getElementById('color-cond').value;
  const p = EXT_POS;

  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 1;

  // ══ PANEL PRINCIPAL ══════════════════════════════
  const d0 = extData[0];
  const ic0 = imgIconos[d0.condFile] || imgIconos['nublado'];

  // Día
  ctx.font = `900 ${Math.round(68*scales.cond)}px Arial`;
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText(dayName(1), p.main.dayX, p.main.dayY);

  // % lluvia (solo número, sin nube)
  ctx.font = `700 ${Math.round(38*scales.temp)}px Arial`;
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText(`${d0.rain}%`, p.main.rainPctX, p.main.rainPctY);

  // Ciudad (UNA SOLA VEZ)
  ctx.font = `700 ${Math.round(34*scales.cond)}px Arial`;
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText('VILLA CARLOS PAZ', p.main.cityX, p.main.cityY);

  // Ícono grande
  const is0 = p.main.iconSize * scales.icon;
  ctx.drawImage(ic0, p.main.iconX - is0/2, p.main.iconY - is0/2, is0, is0);

  // Temp máxima
  ctx.font = `900 ${Math.round(130*scales.temp)}px Arial`;
  ctx.fillStyle = colorTemp; ctx.textAlign = 'left';
  ctx.fillText(`${d0.max}°`, p.main.maxX, p.main.maxY);

  // Temp mínima
  ctx.font = `900 ${Math.round(100*scales.temp)}px Arial`;
  ctx.fillStyle = colorTemp; ctx.globalAlpha = 0.75;
  ctx.fillText(`${d0.min}°`, p.main.minX, p.main.minY);
  ctx.globalAlpha = 1;

  // Condición abajo
  ctx.font = `900 ${Math.round(58*scales.cond)}px Arial`;
  ctx.fillStyle = colorCond; ctx.textAlign = 'center';
  ctx.fillText(d0.cond, p.main.condX, p.main.condY);

  // ══ PANELES DERECHOS ═════════════════════════════
  // Arriba: día 2 | Abajo: día 3
  [[extData[1], p.d1, 2], [extData[2], p.d2, 3]].forEach(([d, pos, off]) => {
    const ic = imgIconos[d.condFile] || imgIconos['nublado'];

    // Día
    ctx.font = `900 ${Math.round(30*scales.cond)}px Arial`;
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText(dayName(off), pos.dayX, pos.dayY);

    // Ícono (centrado en su zona izquierda)
    const is = pos.iconSize * scales.icon;
    ctx.drawImage(ic, pos.iconX - is/2, pos.iconY - is/2, is, is);

    // % lluvia (derecha del panel, sin nube)
    ctx.font = `700 ${Math.round(26*scales.temp)}px Arial`;
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText(`${d.rain}%`, pos.rainPctX, pos.rainPctY);

    // Condición
    ctx.font = `900 ${Math.round(26*scales.cond)}px Arial`;
    ctx.fillStyle = colorCond; ctx.textAlign = 'left';
    ctx.fillText(d.cond, pos.condX, pos.condY);

    // Temp
    ctx.font = `900 ${Math.round(28*scales.temp)}px Arial`;
    ctx.fillStyle = colorTemp; ctx.textAlign = 'left';
    ctx.fillText(`${d.max}°/${d.min}°`, pos.tempX, pos.tempY);
  });

  ctx.restore();
}

// ─── TABS ────────────────────────────────────────────────────────────────────
function showTab(t, btn) {
  tabActual = t;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  document.getElementById('tab-loc').style.display = t==='loc'?'block':'none';
  document.getElementById('tab-ext').style.display = t==='ext'?'block':'none';
  document.getElementById('panel-loc').style.display = t==='loc'?'block':'none';
  document.getElementById('panel-ext').style.display = t==='ext'?'block':'none';
  document.getElementById('panel-title').textContent =
    t==='loc'?'✏️ AJUSTES — LOCALIDADES':'✏️ AJUSTES — PRONÓSTICO EXTENDIDO';
}

// ─── PANEL ───────────────────────────────────────────────────────────────────
function togglePanel() { document.getElementById('sidePanel').classList.toggle('open'); }

function actualizarSlider(tipo, valor) {
  scales[tipo] = valor/100;
  document.getElementById('val-'+tipo).textContent = valor+'%';
  redibujarActual();
}

function redibujarActual() {
  if (tabActual==='loc') dibujarLocalidades();
  else dibujarExtendido();
}

// ─── PANEL LOCALIDADES ───────────────────────────────────────────────────────
function construirPanelLoc() {
  const grid = document.getElementById('edit-grid');
  grid.innerHTML = '';
  LOCS.forEach((loc,i) => {
    const d = weatherData[i];
    const card = document.createElement('div');
    card.className = 'edit-card';
    card.innerHTML = `
      <div class="city-name">${loc.n}</div>
      <label>Condición</label>
      <select id="cond-${i}">${CONDICIONES.map(c=>`<option value="${c}" ${c===d.cond?'selected':''}>${c}</option>`).join('')}</select>
      <div class="temps">
        <div><label>Máx</label><input type="number" id="max-${i}" value="${d.max}"></div>
        <div><label>Mín</label><input type="number" id="min-${i}" value="${d.min}"></div>
      </div>`;
    grid.appendChild(card);
  });
}

function aplicarEdicion() {
  LOCS.forEach((_,i) => {
    const cond = document.getElementById(`cond-${i}`).value;
    weatherData[i] = {
      cond, condFile:condToFile[cond]||"nublado",
      max:document.getElementById(`max-${i}`).value,
      min:document.getElementById(`min-${i}`).value,
    };
  });
  dibujarLocalidades();
}

// ─── PANEL EXTENDIDO ─────────────────────────────────────────────────────────
function construirPanelExt() {
  const grid = document.getElementById('ext-edit-grid');
  grid.innerHTML = '';
  [1,2,3].forEach((off,i) => {
    const d = extData[i];
    const card = document.createElement('div');
    card.className = 'ext-card';
    card.innerHTML = `
      <div class="day-label">${dayName(off)}</div>
      <label>Condición</label>
      <select id="ext-cond-${i}">${CONDICIONES.map(c=>`<option value="${c}" ${c===d.cond?'selected':''}>${c}</option>`).join('')}</select>
      <div class="row3">
        <div><label>Máx</label><input type="number" id="ext-max-${i}" value="${d.max}"></div>
        <div><label>Mín</label><input type="number" id="ext-min-${i}" value="${d.min}"></div>
        <div><label>Lluvia %</label><input type="number" id="ext-rain-${i}" value="${d.rain}" min="0" max="100"></div>
      </div>`;
    grid.appendChild(card);
  });
}

function aplicarEdicionExt() {
  [0,1,2].forEach(i => {
    const cond = document.getElementById(`ext-cond-${i}`).value;
    extData[i] = {
      cond, condFile:condToFile[cond]||"nublado",
      max:document.getElementById(`ext-max-${i}`).value,
      min:document.getElementById(`ext-min-${i}`).value,
      rain:document.getElementById(`ext-rain-${i}`).value,
    };
  });
  dibujarExtendido();
}

// ─── DESCARGAR ───────────────────────────────────────────────────────────────
function descargarActual() {
  const id = tabActual==='loc'?'weatherCanvas':'extCanvas';
  const nombre = tabActual==='loc'?'clima_localidades':'clima_extendido';
  const canvas = document.getElementById(id);
  const fecha = new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
  const link = document.createElement('a');
  link.download = `${nombre}_${fecha}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

loadAll();
</script>
</body>
</html>
